[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "energy-forecasting"
version = "0.1.0"
description = "End-to-end Greek electricity demand forecasting platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "requests>=2.31",
    "pyarrow>=14.0",
    "holidays>=0.40",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.0",
    "neuralforecast>=1.7",
    "mlflow",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]